<!doctype html>
<!-- The page a phone types into the Kindle's terminal from (voice.c).
     kindle/build-web.sh compiles its Tailwind classes, puts the CSS in
     place of the STYLE comment and writes the result to voice-page.h. -->
<html lang="zh" class="bg-neutral-100 dark:bg-neutral-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kindle Terminal">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Kindle Terminal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- STYLE -->
</head>
<body class="min-h-dvh bg-neutral-100 text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">

<!-- what is typed and its buttons: always above the phone's keyboard -->
<main id="composer" class="flex flex-col gap-3 px-4 pt-[max(12px,env(safe-area-inset-top))] pb-4">
  <header class="flex items-center gap-2">
    <img src="/favicon.png" alt="" class="size-7 rounded-md">
    <h1 class="text-lg font-semibold tracking-tight whitespace-nowrap">Kindle Terminal</h1>
    <p id="state" class="ml-auto min-w-0 truncate text-right text-xs text-neutral-500">正在连接…</p>
  </header>
  <textarea id="text" rows="3"
    class="h-28 w-full resize-none rounded-xl border border-neutral-300 bg-white px-3 py-2.5 text-[17px] leading-relaxed shadow-sm outline-none placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-900 dark:focus:border-neutral-300 dark:focus:ring-white/10"
    placeholder="用键盘上的麦克风说，或者直接打字，改好了再发送"></textarea>
  <div class="grid grid-cols-2 gap-2">
    <button id="send" class="btn border-neutral-900 bg-neutral-900 text-white dark:border-white dark:bg-white dark:text-neutral-900">
      <svg class="icon"><use href="/voice-icons.svg#i-send"/></svg>发送</button>
    <button id="run" class="btn">
      <svg class="icon"><use href="/voice-icons.svg#i-run"/></svg>发送并回车</button>
    <button id="enter" class="btn">
      <svg class="icon"><use href="/voice-icons.svg#i-enter"/></svg>回车</button>
    <button id="clear" class="btn">
      <svg class="icon"><use href="/voice-icons.svg#i-clear"/></svg>清空</button>
  </div>
</main>

<!-- what was sent: the keyboard may cover it, the page scrolls to it -->
<section class="px-4 pb-[max(24px,env(safe-area-inset-bottom))]">
  <h2 class="mb-2 flex items-baseline gap-2 text-sm font-semibold text-neutral-500">最近发送<span id="count" class="font-normal"></span></h2>
  <p id="empty" class="text-sm leading-relaxed text-neutral-400">发送过的文字会留在这里（最近 50 条，只存在这台手机上）。点一条填回输入框，连点几条会一行一条接在一起。</p>
  <ul id="history" class="flex flex-col gap-2"></ul>
</section>

<div id="toast" class="pointer-events-none fixed inset-x-0 bottom-[max(20px,env(safe-area-inset-bottom))] mx-auto w-fit max-w-[90vw] rounded-full bg-neutral-900 px-4 py-2 text-sm text-white opacity-0 shadow-lg transition-opacity duration-200 dark:bg-white dark:text-neutral-900"></div>

<template id="item">
  <li class="flex items-stretch rounded-xl border border-neutral-200 bg-white shadow-sm transition-shadow dark:border-neutral-800 dark:bg-neutral-900">
    <!-- the clamp on the text, not the button: buttons do not take it -->
    <button data-act="fill" class="min-w-0 flex-1 px-3 py-2.5 text-left">
      <span class="line-clamp-3 text-[15px] leading-snug break-words whitespace-pre-wrap"></span>
    </button>
    <div class="flex shrink-0 items-center pr-1">
      <button data-act="send" aria-label="发送" class="icon-btn"><svg class="icon"><use href="/voice-icons.svg#i-send"/></svg></button>
      <button data-act="run" aria-label="发送并回车" class="icon-btn"><svg class="icon"><use href="/voice-icons.svg#i-run"/></svg></button>
      <button data-act="copy" aria-label="复制" class="icon-btn"><svg class="icon"><use href="/voice-icons.svg#i-copy"/></svg></button>
    </div>
  </li>
</template>

<script>
const base = location.pathname.replace(/\/+$/, '');
const $ = id => document.getElementById(id);
const text = $('text'), state = $('state'), list = $('history'), composer = $('composer');
/** Entries kept */
const LIMIT = 50;

// ---- sending ----

/** The line under the title: whether the Kindle is there */
function show(ok, message) {
  state.classList.toggle('text-emerald-600', ok);
  state.classList.toggle('text-red-600', !ok);
  state.textContent = message;
}

async function ping() {
  try {
    const r = await fetch(base + '/ping', {cache: 'no-store'});
    if (r.ok) show(true, '已连接 Kindle');
    else show(false, r.status == 403 ? '口令不对：请重新扫 Kindle 上的二维码' : 'Kindle 出错了（' + r.status + '）');
  } catch (e) {
    show(false, '连不上 Kindle：kterm 开着吗？语音输入打开了吗？');
  }
}

/** What the Kindle did with the text, see voicebar.c */
const done = {
  staged: '已放进 Kindle 键盘上方的框里',
  ran: '已放入并回车',
  'staged-run': 'Kindle 正往上翻：已放进框里，点一下就执行',
};

/**
 * @param value Text, may be empty
 * @param run Enter after it
 * @return true if the Kindle took it
 */
async function send(value, run) {
  try {
    const r = await fetch(base + '/send' + (run ? '?run=1' : ''), {
      method: 'POST', body: value, headers: {'Content-Type': 'text/plain;charset=utf-8'}});
    if (!r.ok) throw new Error(r.status);
    const status = await r.text();
    show(true, '已连接 Kindle');
    // what became of it: told once, for a moment
    toast(done[status] || 'Kindle 没有回应，文字可能没放进去');
    return !!done[status];
  } catch (e) {
    show(false, '没发出去：连不上 Kindle');
    toast('没发出去：连不上 Kindle');
    return false;
  }
}

async function sendText(run) {
  const value = text.value;
  if (!value && !run) return;
  if (await send(value, run)) {
    remember(value);
    // not if more was typed meanwhile
    if (text.value === value) { text.value = ''; localStorage.removeItem('draft'); }
  }
}

// ---- history, kept in this browser ----

function load() {
  try {
    const h = JSON.parse(localStorage.getItem('history') || '[]');
    return Array.isArray(h) ? h.filter(x => typeof x === 'string') : [];
  } catch (e) { return []; }
}
let history = load();

/** The newest first; the same text once */
function remember(value) {
  if (!value.trim()) return;
  history = [value, ...history.filter(x => x !== value)].slice(0, LIMIT);
  localStorage.setItem('history', JSON.stringify(history));
  render();
}

function render() {
  const template = $('item');
  list.replaceChildren(...history.map((value, index) => {
    const li = template.content.firstElementChild.cloneNode(true);
    li.dataset.index = index;
    li.querySelector('[data-act=fill] span').textContent = value;
    return li;
  }));
  $('count').textContent = history.length ? history.length + ' 条' : '';
  $('empty').hidden = history.length > 0;
}

/** Put an entry back in the box: after what is there, a line of its own */
function fill(value) {
  text.value = text.value ? text.value.replace(/\n*$/, '\n') + value : value;
  localStorage.setItem('draft', text.value);
  toast('已填回输入框');
}

/** Copy to the clipboard; the page is not https, so the old way if need be */
async function copy(value) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
      return true;
    }
  } catch (e) {}
  const area = document.createElement('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.append(area);
  area.select();
  area.setSelectionRange(0, value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  area.remove();
  return ok;
}

list.addEventListener('click', async e => {
  const button = e.target.closest('button[data-act]');
  const li = button && button.closest('li');
  if (!li) return;
  const value = history[li.dataset.index];
  if (value === undefined) return;
  const act = button.dataset.act;
  if (act === 'fill') {
    fill(value);
    li.classList.add('ring-2', 'ring-neutral-900', 'dark:ring-white');
    setTimeout(() => li.classList.remove('ring-2', 'ring-neutral-900', 'dark:ring-white'), 600);
  } else if (act === 'send' || act === 'run') {
    if (await send(value, act === 'run')) remember(value);
  } else if (act === 'copy') {
    const ok = await copy(value);
    toast(ok ? '已复制' : '复制失败');
    if (ok) {
      const use = button.querySelector('use');
      use.setAttribute('href', '/voice-icons.svg#i-check');
      setTimeout(() => use.setAttribute('href', '/voice-icons.svg#i-copy'), 1500);
    }
  }
});

// ---- the page ----

let toastTimer = 0;
function toast(message) {
  const t = $('toast');
  t.textContent = message;
  t.classList.remove('opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0'), 1800);
}

/* The text box takes at most about a third of the screen; with the
   keyboard out, what is left above it, so that the buttons are never
   covered. The list below may be: the page scrolls to it. */
let tallest = window.innerHeight;
function fit() {
  const v = window.visualViewport;
  const visible = v ? v.height : window.innerHeight;
  tallest = Math.max(tallest, window.innerHeight);
  const others = composer.offsetHeight - text.offsetHeight;
  const height = Math.min(Math.round(tallest * 0.3), visible - others);
  text.style.height = Math.max(64, height) + 'px';
  if (document.activeElement === text) window.scrollTo(0, 0);
}
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
window.addEventListener('resize', fit);
text.addEventListener('focus', () => setTimeout(fit, 350));

// a tap on a button keeps the keyboard up: the focus stays in the box
for (const button of composer.querySelectorAll('button')) {
  button.addEventListener('pointerdown', e => { if (document.activeElement === text) e.preventDefault(); });
}
$('send').onclick = () => sendText(false);
$('run').onclick = () => sendText(true);
$('enter').onclick = () => send('', true);
$('clear').onclick = () => { text.value = ''; localStorage.removeItem('draft'); };

text.value = localStorage.getItem('draft') || '';
text.addEventListener('input', () => localStorage.setItem('draft', text.value));
document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
setInterval(() => { if (!document.hidden) ping(); }, 15000);
render();
fit();
ping();
</script>
</body>
</html>
