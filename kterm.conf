# kterm.conf

# keyboard:  0 - off, 1 - on
keyboard = 1
# color scheme: 0 - light, 1 - dark
color_scheme = 0
# tab bar at startup: 0 - visible, 1 - hidden
#auto_hide_tabs = 1
# font family 
font_family = "Monospace"
# font size
font_size = 8
# terminal encoding
#encoding = "UTF-8"
# keyboard config file 
#kb_conf_path = "/usr/local/share/kterm/keyboard-kindle.xml"
# screen orientation: U, R or L
#orientation = U
# cursor shape: B, I or U
#cursor_shape = B
# tmux prefix key, for the gestures that drive tmux (swipe left or right in
# reading mode: next or previous window): "C-b", "C-a", "C-Space", ...
#tmux_prefix = "C-b"
