# kterm 快捷栏：键盘上方的一排按钮，点一下发出一串按键。
# 一行一个按钮，从左到右排；超过 8 个分两行，最多 16 个。
# 改完退出终端再打开就生效。
#
# 写法：
#   C-u                      按钮上显示 C-u，点了发 Ctrl+u
#   TX = C-Space             按钮上显示 TX，点了发 Ctrl+Space
#   拉代码 = "git pull" Enter  引号里是文字，Enter 是回车
#
# 按键：C-x 是 Ctrl+x，M-x 是 Alt+x；空格分开先后按的键（C-Space c）。
# 有名字的键：Enter Tab Esc Space BSpace Up Down Left Right Home End
#            PgUp PgDn Insert Delete F1-F12
# 普通字母区分大小写；Ctrl 加字母不分（C-c 和 C-C 一样）。
# 要发送等号本身，写成 "="。
# 写错的行会跳过，键盘上方会提示第几行错了。

C-a
C-e
C-u
C-y
C-w
C-c
TX = C-Space
